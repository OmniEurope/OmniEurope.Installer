name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-test:
    # Windows only: the MSI is written and read through msi.dll, and the tests extract it with msiexec.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The SDK of global.json builds; .NET 10 is installed too, since the packages and the tests also target it.
          dotnet-version: 10.0.x
          global-json-file: global.json
      - name: Restore
        run: dotnet restore OmniEurope.Installer.slnx
      - name: Build
        # Directory.Build.props sets TreatWarningsAsErrors: any warning fails this step.
        run: dotnet build OmniEurope.Installer.slnx --configuration Release --no-restore
      - name: Unit tests
        # global.json runs dotnet test on Microsoft.Testing.Platform: xunit.v3 is the runner.
        run: >-
          dotnet test --project tests/OmniEurope.Installer.Tests/OmniEurope.Installer.Tests.csproj
          --framework net11.0-windows
          --configuration Release --no-build --no-progress
          --coverlet
          --report-trx --report-trx-filename tests.trx --results-directory artifacts/tests
      - name: Verify test results
        # A missing, empty or failed run is a failure, never a silent pass.
        shell: pwsh
        run: ./.github/scripts/verify-test-results.ps1 -ResultsDirectory artifacts/tests -ReportName tests.trx
      - name: Unit tests on .NET 10
        # The same suite on the other runtime the packages support; coverage is measured once, on .NET 11.
        run: >-
          dotnet test --project tests/OmniEurope.Installer.Tests/OmniEurope.Installer.Tests.csproj
          --framework net10.0-windows
          --configuration Release --no-build --no-progress
          --report-trx --report-trx-filename tests-net10.trx --results-directory artifacts/tests-net10
      - name: Verify .NET 10 test results
        shell: pwsh
        run: ./.github/scripts/verify-test-results.ps1 -ResultsDirectory artifacts/tests-net10 -ReportName tests-net10.trx
      - name: Coverage floors
        shell: pwsh
        run: ./.github/scripts/coverage-gate.ps1 -CoverageRoot artifacts/tests
      - name: CRAP gate
        shell: pwsh
        run: ./.github/scripts/crap-gate.ps1 -CoverageRoot artifacts/tests
      - name: Pack
        # The library and the oe-installer tool (which bundles the setup host): the exact files a release publishes.
        run: |
          dotnet pack src/OmniEurope.Installer/OmniEurope.Installer.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/OmniEurope.Installer.Tool/OmniEurope.Installer.Tool.csproj --configuration Release --no-build --output artifacts/packages
      - name: Check package content
        shell: pwsh
        run: ./.github/scripts/test-packages.ps1 -PackageDirectory artifacts/packages
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: artifacts/packages
          if-no-files-found: error

  integration:
    # GitHub's Windows runners are disposable and run as administrator: the setup executable is run for
    # real, quietly, on a throwaway fixture product (install, update, downgrade, running app, former setup entry, file in use,
    # per-user install and update, the MSI alone as a Group Policy assignment runs it).
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      OE_INSTALLER_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore OmniEurope.Installer.slnx
      - name: Build
        # The integration tests run the setup host built here, in the same configuration.
        run: dotnet build OmniEurope.Installer.slnx --configuration Release --no-restore
      - name: Integration tests
        run: >-
          dotnet test --project tests/OmniEurope.Installer.IntegrationTests/OmniEurope.Installer.IntegrationTests.csproj
          --configuration Release --no-build --no-progress
          --report-trx --report-trx-filename integration.trx --results-directory artifacts/integration
      - name: Verify test results
        shell: pwsh
        run: ./.github/scripts/verify-test-results.ps1 -ResultsDirectory artifacts/integration -ReportName integration.trx
